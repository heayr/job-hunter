<!-- Analytics Status Strip Component -->
<div class="glass-panel rounded-2xl px-4 py-2.5 mb-3 flex items-center justify-between text-xs flex-wrap gap-2 border border-slate-800 shadow-sm">
    <div class="flex items-center gap-4 sm:gap-6 flex-wrap">
        <div class="flex items-center gap-1.5">
            <span class="text-slate-400">Всего:</span>
            <span class="font-bold text-white font-mono" id="stat-total">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-slate-400">🇷🇺 RU:</span>
            <span class="font-bold text-amber-400 font-mono" id="stat-ru">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-slate-400">🌍 Remote:</span>
            <span class="font-bold text-sky-400 font-mono" id="stat-en">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-slate-400">Отправлено:</span>
            <span class="font-bold text-indigo-400 font-mono" id="stat-sent">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-slate-400">Ответили:</span>
            <span class="font-bold text-emerald-400 font-mono" id="stat-replied">0</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <span class="text-slate-400">Конверсия (Win Rate):</span>
        <span class="font-bold text-purple-300 bg-purple-950/60 px-2 py-0.5 rounded-lg border border-purple-800/50 font-mono" id="stat-winrate">0%</span>
    </div>
</div>
