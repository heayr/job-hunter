<!-- Profiles View Component -->
<div id="profiles-view" class="max-w-[1600px] mx-auto px-3 sm:px-6 py-4 hidden">
    <div class="glass-panel rounded-2xl p-6 border border-slate-800 shadow-xl">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-700/60">
            <div>
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span>👤</span> Персоны и Резюме
                </h2>
                <p class="text-xs text-slate-400 mt-0.5">Управляйте профилями для откликов на русском и английском языках</p>
            </div>
            <button onclick="addProfile()"
                class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-md shadow-purple-600/20 cursor-pointer transition-all">
                ➕ Добавить профиль
            </button>
        </div>
        <div class="flex flex-col lg:flex-row gap-6 items-start">
            <div class="w-full lg:w-1/3 flex flex-col gap-2.5 h-[calc(100vh-12rem)] overflow-y-auto pr-2" id="profiles-list">
            </div>
            <div class="w-full lg:w-2/3" id="profile-editor">
                <div class="text-slate-400 text-center py-20 text-sm">Выберите профиль слева</div>
            </div>
        </div>
    </div>
</div>
