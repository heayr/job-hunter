<!-- Cropper Modal Component -->
<div id="cropper-modal" class="modal">
    <div class="glass-panel-elevated p-5 rounded-2xl w-[500px] max-w-[95vw] border border-slate-700 shadow-2xl relative">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <span>✂️</span> Центрирование фото (1:1)
            </h2>
            <button onclick="toggleModal('cropper-modal')" class="text-slate-400 hover:text-white text-sm p-1 rounded-lg hover:bg-slate-800 transition-colors">✕</button>
        </div>
        <div class="w-full h-[320px] bg-slate-950 mb-3 overflow-hidden flex justify-center rounded-xl border border-slate-800">
            <img id="cropper-image" class="max-w-full hidden">
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
            <button onclick="toggleModal('cropper-modal')"
                class="px-4 py-2 text-xs text-slate-400 hover:text-white transition-colors">Отмена</button>
            <button onclick="saveCrop()"
                class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all shadow-md shadow-purple-600/20">
                Применить аватар
            </button>
        </div>
    </div>
</div>
