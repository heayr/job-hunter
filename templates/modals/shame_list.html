<!-- Shame List Public Export Modal Component -->
<div id="shame-list-modal" class="modal">
    <div class="glass-panel-elevated rounded-2xl max-w-3xl w-full p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
            <div class="flex items-center gap-2.5">
                <span class="text-xl">💩</span>
                <div>
                    <h3 class="text-base font-bold text-white">Доска позора недобросовестных работодателей</h3>
                    <p class="text-[11px] text-slate-400">Публичный реестр для публикации в README или на GitHub Gist</p>
                </div>
            </div>
            <button onclick="toggleModal('shame-list-modal')" class="text-slate-400 hover:text-white text-sm p-1 rounded-lg hover:bg-slate-800 transition-colors">✕</button>
        </div>

        <div class="py-3 flex-1 overflow-y-auto">
            <pre id="shame-list-content" class="bg-slate-950 p-4 rounded-xl text-xs font-mono text-slate-300 whitespace-pre-wrap border border-slate-800 max-h-[50vh] overflow-y-auto select-all"></pre>
        </div>

        <div class="flex justify-between items-center pt-3 border-t border-slate-800">
            <span class="text-[11px] text-slate-500">Файл также синхронизирован в корне: <code>SHAME_LIST.md</code></span>
            <div class="flex gap-2">
                <button onclick="copyShameListMarkdown()" class="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-semibold text-xs px-4 py-2 rounded-xl shadow-md flex items-center gap-1.5">
                    📋 Скопировать Markdown для GitHub
                </button>
                <button onclick="toggleModal('shame-list-modal')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-xl">Закрыть</button>
            </div>
        </div>
    </div>
</div>
