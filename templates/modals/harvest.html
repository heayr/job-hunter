<!-- Harvest Modal Component -->
<div id="harvest-modal" class="modal">
    <div class="glass-panel-elevated p-6 rounded-2xl w-[620px] max-w-[95vw] border border-slate-700/80 shadow-2xl relative">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div id="harvest-radar" class="w-9 h-9 rounded-xl bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-lg animate-pulse">
                    🔄
                </div>
                <div>
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        Сбор вакансий по источникам
                    </h2>
                    <p class="text-[11px] text-slate-400">Greenhouse, Lever, Hacker News, Jobicy, HH.ru, SuperJob, Rabota.ru, Хабр, Telegram, WWR, Crypto</p>
                </div>
            </div>
            <div id="harvest-badge" class="text-xs px-2.5 py-1 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-800 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
                <span>Сканирование...</span>
            </div>
        </div>

        <!-- Active animated progress card -->
        <div id="harvest-status-card" class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 mb-3">
            <div class="flex items-center justify-between mb-2 text-xs">
                <span id="harvest-current-step" class="font-semibold text-slate-200">Инициализация модулей поиска...</span>
                <span id="harvest-percent" class="text-indigo-400 font-mono font-bold">В процессе</span>
            </div>
            <!-- Progress bar -->
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="harvest-progress-bar" class="bg-gradient-to-r from-indigo-500 via-sky-500 to-emerald-500 h-2 rounded-full w-1/3 transition-all duration-500 animate-pulse"></div>
            </div>
            <div class="grid grid-cols-4 gap-2 mt-3 text-[11px] text-slate-400 text-center">
                <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80">
                    <div class="text-slate-500 text-[10px]">Площадки</div>
                    <div id="harvest-metric-scrapers" class="font-bold text-slate-300 mt-0.5">0 / 11</div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80">
                    <div class="text-slate-500 text-[10px]">Сохранено</div>
                    <div id="harvest-metric-saved" class="font-bold text-emerald-400 mt-0.5">0</div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80">
                    <div class="text-slate-500 text-[10px]">Анти-BS отсев</div>
                    <div id="harvest-metric-filtered" class="font-bold text-amber-400 mt-0.5">0</div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80">
                    <div class="text-slate-500 text-[10px]">Дубликаты</div>
                    <div id="harvest-metric-dups" class="font-bold text-slate-400 mt-0.5">0</div>
                </div>
            </div>
        </div>

        <!-- Terminal Details -->
        <div class="mb-4">
            <button onclick="toggleTerminalLogs()" type="button" class="w-full flex items-center justify-between text-xs text-slate-400 hover:text-slate-200 py-1 px-2 rounded-lg hover:bg-slate-800/50 transition-colors">
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="toggle-logs-text">Лог терминала в реальном времени</span>
                </span>
                <span id="toggle-logs-arrow">▲</span>
            </button>
            <div id="terminal-container" class="mt-2">
                <div class="terminal text-[11px] h-48 overflow-y-auto font-mono leading-relaxed bg-slate-950/90 p-3 rounded-xl border border-slate-800/90 text-slate-300 shadow-inner" id="harvest-logs">Ожидание запуска...</div>
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
            <button onclick="closeHarvest()" id="harvest-close-btn"
                class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-950/50 flex items-center gap-2 ring-2 ring-emerald-500/40 hidden">
                <span>🎉</span> Посмотреть найденные вакансии
            </button>
        </div>
    </div>
</div>
