<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form D — Non-Standard Unorthodox Layout</title>
  <style>
    body { font-family: sans-serif; background: #1e1e2f; color: #fff; padding: 40px; max-width: 580px; margin: auto; }
    .box { background: #27293d; border-radius: 8px; padding: 20px; }
    .row { margin-bottom: 15px; }
    .text-title { font-size: 11px; text-transform: uppercase; color: #9a9a9a; margin-bottom: 4px; }
    .styled-input { width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 2px solid #e14eca; color: #fff; padding: 8px 0; font-size: 15px; }
    .styled-input:focus { outline: none; border-bottom-color: #00f2c3; }
    .custom-btn { display: inline-block; background: linear-gradient(to bottom left, #e14eca, #ba54f5); color: #fff; padding: 12px 30px; border-radius: 25px; font-weight: 600; cursor: pointer; text-align: center; margin-top: 15px; user-select: none; }
    .custom-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Start Your Career With Us</h3>
    <p style="font-size: 12px; color: #9a9a9a;">Unorthodox layout without standard form tags.</p>

    <div class="row">
      <div class="text-title">Applicant Name</div>
      <input type="text" class="styled-input" aria-label="Applicant Name" placeholder="Your full name">
    </div>

    <div class="row">
      <div class="text-title">Direct Contact Email</div>
      <input type="email" class="styled-input" aria-label="Direct Contact Email" placeholder="Where we can reach you">
    </div>

    <div class="row">
      <div class="text-title">LinkedIn Profile URL</div>
      <input type="url" class="styled-input" aria-label="LinkedIn Profile URL" placeholder="https://linkedin.com/in/...">
    </div>

    <div class="row">
      <div class="text-title">Attach Curriculum Vitae</div>
      <input type="file" class="styled-input" aria-label="Curriculum Vitae" style="border: none;">
    </div>

    <div role="button" tabindex="0" class="custom-btn" id="unorthodox-submit-btn" onclick="triggerSubmit()">
      Dispatch Candidacy
    </div>

    <div id="unorthodox-done" style="display: none; margin-top: 15px; color: #00f2c3; font-weight: bold;">
      🚀 Candidacy dispatched!
    </div>
  </div>

  <script>
    function triggerSubmit() {
      document.getElementById('unorthodox-done').style.display = 'block';
    }
  </script>
</body>
</html>
