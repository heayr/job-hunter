<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form C — Multi-Step ATS Application Wizard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding: 40px; max-width: 600px; margin: auto; }
    .wizard-card { background: #131b2e; border: 1px solid #1e293b; padding: 24px; border-radius: 12px; }
    .steps { display: flex; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .step-item { font-size: 12px; color: #64748b; font-weight: 600; }
    .step-item.active { color: #38bdf8; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #090d16; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #6366f1; color: white; flex: 1; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .step-panel { display: none; }
    .step-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="wizard-card">
    <div class="steps">
      <span id="s1-indicator" class="step-item active">Step 1: Contact</span>
      <span id="s2-indicator" class="step-item">Step 2: Experience</span>
      <span id="s3-indicator" class="step-item">Step 3: Review</span>
    </div>

    <!-- Step 1 -->
    <div id="step-1" class="step-panel active">
      <div class="form-group">
        <label for="w-name">Full Name *</label>
        <input type="text" id="w-name" required placeholder="Alex Mercer">
      </div>
      <div class="form-group">
        <label for="w-email">Email Address *</label>
        <input type="email" id="w-email" required placeholder="alex@mercer.dev">
      </div>
      <div class="form-group">
        <label for="w-phone">Phone Number</label>
        <input type="tel" id="w-phone" placeholder="+1-202-555-0199">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" onclick="goToStep(2)">Next: Experience →</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div id="step-2" class="step-panel">
      <div class="form-group">
        <label for="w-years">Years of Professional Experience *</label>
        <select id="w-years">
          <option value="">Select...</option>
          <option value="1-3">1–3 years</option>
          <option value="3-5">3–5 years</option>
          <option value="5-8">5–8 years</option>
          <option value="8+">8+ years</option>
        </select>
      </div>
      <div class="form-group">
        <label for="w-cv">Attach Resume (PDF) *</label>
        <input type="file" id="w-cv" accept=".pdf">
      </div>
      <div class="form-group">
        <label for="w-notice">Notice Period</label>
        <input type="text" id="w-notice" placeholder="e.g. 2 weeks / immediate">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" onclick="goToStep(1)">← Back</button>
        <button type="button" class="btn btn-primary" onclick="goToStep(3)">Next: Review →</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div id="step-3" class="step-panel">
      <h3>Review Your Application</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">Please verify your information before final submission.</p>
      <div id="review-summary" style="background: #090d16; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 20px;"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" onclick="goToStep(2)">← Back</button>
        <button type="button" class="btn btn-primary" id="wizard-submit-btn" onclick="submitWizard()">Submit Application</button>
      </div>
    </div>

    <div id="wizard-success" style="display: none; padding: 20px; text-align: center; color: #34d399; font-weight: 700;">
      🎉 Application Successfully Delivered!
    </div>
  </div>

  <script>
    let currentStep = 1;
    function goToStep(step) {
      currentStep = step;
      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.step-item').forEach(i => i.classList.remove('active'));

      document.getElementById(`step-${step}`).classList.add('active');
      document.getElementById(`s${step}-indicator`).classList.add('active');

      if (step === 3) {
        document.getElementById('review-summary').innerHTML = `
          <b>Name:</b> ${document.getElementById('w-name').value || '—'}<br>
          <b>Email:</b> ${document.getElementById('w-email').value || '—'}<br>
          <b>Experience:</b> ${document.getElementById('w-years').value || '—'}<br>
          <b>Notice:</b> ${document.getElementById('w-notice').value || '—'}
        `;
      }
    }

    function submitWizard() {
      document.getElementById('step-3').style.display = 'none';
      document.getElementById('wizard-success').style.display = 'block';
    }
  </script>
</body>
</html>
