<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form A — Standard Job Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
    .required-star { color: #f43f5e; margin-left: 2px; }
    input, textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    input:focus, textarea:focus { border-color: #6366f1; outline: none; }
    .file-dropzone { border: 2px dashed #475569; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; }
    button { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #4f46e5; }
    .success-banner { display: none; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; padding: 16px; border-radius: 8px; text-align: center; margin-top: 20px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Senior Frontend Engineer — Acme Corp</h2>
  <p style="color: #94a3b8; font-size: 13px; margin-bottom: 24px;">Please fill in the application form below.</p>

  <form id="app-form" onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label for="first-name">First Name <span class="required-star">*</span></label>
      <input type="text" id="first-name" name="firstName" required placeholder="Jane">
    </div>

    <div class="form-group">
      <label for="last-name">Last Name <span class="required-star">*</span></label>
      <input type="text" id="last-name" name="lastName" required placeholder="Doe">
    </div>

    <div class="form-group">
      <label for="email">Email Address <span class="required-star">*</span></label>
      <input type="email" id="email" name="email" required placeholder="jane@example.com">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
    </div>

    <div class="form-group">
      <label for="cv-file">Resume / CV (PDF or DOCX) <span class="required-star">*</span></label>
      <div class="file-dropzone">
        <input type="file" id="cv-file" name="resume" accept=".pdf,.docx" required>
      </div>
    </div>

    <div class="form-group">
      <label for="cover-letter">Cover Letter</label>
      <textarea id="cover-letter" name="coverLetter" rows="5" placeholder="Tell us why you are a great fit..."></textarea>
    </div>

    <button type="submit" id="submit-btn">Submit Application</button>
  </form>

  <div id="success-msg" class="success-banner">
    🎉 Application submitted successfully!
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('app-form').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    }
  </script>
</body>
</html>
