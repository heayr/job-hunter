<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form B — Dynamic React-like Application Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f8fafc; padding: 40px; max-width: 620px; margin: auto; }
    .card { background: #131b2e; border: 1px solid #1e293b; padding: 24px; border-radius: 12px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    .error-text { color: #fb7185; font-size: 12px; margin-top: 4px; display: none; }
    .is-invalid { border-color: #f43f5e !important; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .radio-group { display: flex; gap: 16px; margin-top: 6px; }
    .radio-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #94a3b8; cursor: pointer; }
    button { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fullstack Developer Application</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Dynamic controlled form with live validation.</p>

    <div class="form-group">
      <label id="lbl-name">Full Name *</label>
      <input type="text" id="full-name" aria-labelledby="lbl-name" placeholder="John Doe">
      <div id="err-name" class="error-text">Name is required and must contain at least 2 words.</div>
    </div>

    <div class="form-group">
      <label id="lbl-email">Work Email *</label>
      <input type="email" id="work-email" aria-labelledby="lbl-email" placeholder="john@company.com">
      <div id="err-email" class="error-text">Please enter a valid work email address.</div>
    </div>

    <div class="form-group">
      <label>Primary Tech Stack</label>
      <select id="primary-stack">
        <option value="">Select your core stack...</option>
        <option value="react_ts">React + TypeScript</option>
        <option value="vue_ts">Vue.js + TypeScript</option>
        <option value="fullstack_node">Fullstack Node.js + React</option>
        <option value="python_react">Python / FastAPI + React</option>
      </select>
    </div>

    <div class="form-group">
      <label>Are you legally authorized to work remotely?</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="auth" value="yes"> Yes</label>
        <label class="radio-label"><input type="radio" name="auth" value="no"> No</label>
      </div>
    </div>

    <div class="form-group">
      <label>Attach Resume (PDF)</label>
      <input type="file" id="resume-input" accept=".pdf">
    </div>

    <button id="dynamic-submit-btn">Apply Now</button>
    <div id="form-b-status" style="display: none; margin-top: 15px; text-align: center; color: #34d399; font-weight: 600;">✅ Submission Accepted!</div>
  </div>

  <script>
    const nameInp = document.getElementById('full-name');
    const emailInp = document.getElementById('work-email');
    const submitBtn = document.getElementById('dynamic-submit-btn');

    nameInp.addEventListener('blur', () => {
      const val = nameInp.value.trim();
      const valid = val.split(/\s+/).length >= 2;
      nameInp.classList.toggle('is-invalid', !valid);
      document.getElementById('err-name').style.display = valid ? 'none' : 'block';
    });

    emailInp.addEventListener('blur', () => {
      const val = emailInp.value.trim();
      const valid = val.includes('@') && val.includes('.');
      emailInp.classList.toggle('is-invalid', !valid);
      document.getElementById('err-email').style.display = valid ? 'none' : 'block';
    });

    submitBtn.addEventListener('click', () => {
      nameInp.dispatchEvent(new Event('blur'));
      emailInp.dispatchEvent(new Event('blur'));
      if (!nameInp.classList.contains('is-invalid') && !emailInp.classList.contains('is-invalid') && nameInp.value) {
        document.getElementById('form-b-status').style.display = 'block';
      }
    });
  </script>
</body>
</html>
